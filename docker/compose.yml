name: bot-telegram

networks:
  default:
    name: bot-telegram
    driver: bridge

volumes:
  phpmyadmin:

services:
  webapp:
    container_name: webapp
    build:
      context: ../
      dockerfile: ./docker/webapp/Dockerfile
    volumes:
      - ../laravel:/var/www/html
      - ./webapp/php.ini:/usr/local/etc/php/php.ini
    networks:
      - default
    depends_on:
      mysql:
        condition: service_healthy

  nextjs:
    container_name: nextjs
    build:
      context: ../
      dockerfile: ./docker/nextjs/Dockerfile
    volumes:
      - ../nextjs:/app
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: development
      INTERNAL_API_URL: http://nginx/api
      NEXT_PUBLIC_API_URL: /api
    networks:
      - default
    depends_on:
      - webapp

  phpmyadmin:
    container_name: phpmyadmin
    image: phpmyadmin:5.2-fpm-alpine
    volumes:
      - phpmyadmin:/var/www/html
    networks:
      - default
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
      PMA_ABSOLUTE_URI: ${WEBAPP_URL:-http://localhost}${WEBAPP_PORT:+:${WEBAPP_PORT}}/phpmyadmin/

  nginx:
    container_name: nginx
    image: nginx:1.30-alpine
    ports:
      - ${WEBAPP_PORT:-80}:80
    volumes:
      - ../laravel:/var/www/html
      - phpmyadmin:/var/www/phpmyadmin:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - default
    depends_on:
      - webapp
      - phpmyadmin
      - nextjs

  mysql:
    container_name: mysql
    image: mysql:8.4
    networks:
      - default
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: testdb
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
